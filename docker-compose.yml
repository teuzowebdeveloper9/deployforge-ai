services:
  gateway:
    image: nginx:1.27-alpine
    container_name: deployforge-gateway
    environment:
      PUBLIC_CORS_ORIGIN: ${PUBLIC_CORS_ORIGIN:-http://localhost:8080}
      GATEWAY_INTERNAL_AUTH_TOKEN: ${GATEWAY_INTERNAL_AUTH_TOKEN:-dev_internal_auth_token_change_me}
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-dev_gateway_service_token_change_me}
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/nginx/includes:/etc/nginx/includes:ro
    command:
      - /bin/sh
      - -c
      - envsubst '$$GATEWAY_INTERNAL_AUTH_TOKEN $$GATEWAY_SERVICE_TOKEN $$PUBLIC_CORS_ORIGIN' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'
    depends_on:
      - web
      - auth-service
      - api
      - agent-service
      - runner-service
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: deployforge-postgres
    environment:
      POSTGRES_USER: deployforge
      POSTGRES_PASSWORD: deployforge_dev_password
      POSTGRES_DB: deployforge
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployforge -d deployforge"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: deployforge-redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  minio:
    image: minio/minio:latest
    container_name: deployforge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data
    networks:
      - backend

  registry:
    image: registry:2
    container_name: deployforge-registry
    expose:
      - "5000"
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: deployforge-prometheus
    expose:
      - "9090"
    volumes:
      - ./infra/docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - backend

  loki:
    image: grafana/loki:2.9.8
    container_name: deployforge-loki
    command: -config.file=/etc/loki/local-config.yaml
    expose:
      - "3100"
    volumes:
      - ./infra/docker/observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: deployforge-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    expose:
      - "3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - backend

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: deployforge-auth-service
    environment:
      NODE_ENV: development
      PORT: "3003"
      DATABASE_URL: postgresql://deployforge:deployforge_dev_password@postgres:5432/deployforge?schema=public
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_TOKEN_SECRET:-dev_access_token_secret_change_me_32_bytes}
      JWT_ISSUER: ${JWT_ISSUER:-deployforge-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-deployforge-gateway}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:-dev_refresh_token_pepper_change_me_32_bytes}
      GATEWAY_INTERNAL_AUTH_TOKEN: ${GATEWAY_INTERNAL_AUTH_TOKEN:-dev_internal_auth_token_change_me}
    expose:
      - "3003"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start:dev"]
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: deployforge-api
    environment:
      NODE_ENV: development
      PORT: "3001"
      DATABASE_URL: postgresql://deployforge:deployforge_dev_password@postgres:5432/deployforge?schema=public
      REDIS_URL: redis://redis:6379
      QUEUE_PROVIDER: bullmq
      STORAGE_PROVIDER: local
      STORAGE_ROOT: /data/storage
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: deployforge
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      SECRETS_PROVIDER: local
      VAULT_ADDR: http://vault:8200
      OBSERVABILITY_PROVIDER: stdout
      RUNNER_SERVICE_URL: http://runner-service:8082
      AGENT_SERVICE_URL: http://agent-service:8001
      AUTH_PROVIDER: gateway
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-dev_gateway_service_token_change_me}
      ENABLE_API_CORS: "false"
      CORS_ORIGIN: http://localhost:8080
    expose:
      - "3001"
    volumes:
      - storage-data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      agent-service:
        condition: service_started
      runner-service:
        condition: service_started
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start:dev"]
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: deployforge-web
    environment:
      NEXT_PUBLIC_API_URL: /api
    expose:
      - "3000"
    depends_on:
      - api
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    networks:
      - backend

  agent-service:
    build:
      context: .
      dockerfile: apps/agent-service/Dockerfile
    container_name: deployforge-agent-service
    environment:
      PORT: "8001"
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-dev_gateway_service_token_change_me}
      AI_PROVIDER_ORDER: ${AI_PROVIDER_ORDER:-anthropic,gemini,openai,openrouter,deepseek,mistral}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-24000}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-120}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-replace_me}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-replace_me}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-replace_me}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-pro-preview}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-2.5-flash,gemini-2.0-flash,gemini-flash-latest}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-replace_me}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-replace_me}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-opus-4.8}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-replace_me}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-replace_me}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-large-latest}
      LOG_LEVEL: INFO
      OBSERVABILITY_PROVIDER: stdout
    expose:
      - "8001"
    networks:
      - backend

  runner-service:
    build:
      context: .
      dockerfile: apps/runner-service/Dockerfile
    container_name: deployforge-container-service
    environment:
      PORT: "8082"
      STORAGE_ROOT: /data/storage
      QUALITY_TIMEOUT_SECONDS: "120"
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-dev_gateway_service_token_change_me}
      SANDBOX_PROVIDER: local-workspace
      OBSERVABILITY_PROVIDER: stdout
    expose:
      - "8082"
    volumes:
      - storage-data:/data/storage
    networks:
      backend:
        aliases:
          - container-service

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  storage-data:
  minio-data:
  registry-data:
  loki-data:
  grafana-data:
